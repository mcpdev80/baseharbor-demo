name: init-targeted

on:
  pull_request:
    branches:
      - main
    paths:
      - tests/init/run.sh
      - .github/workflows/init-targeted.yml

permissions:
  contents: read

jobs:
  init:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout demo
        uses: actions/checkout@v7.0.1

      - name: Checkout BaseHarbor candidate
        uses: actions/checkout@v7.0.1
        with:
          repository: mcpdev80/baseharbor
          ref: fd30abd87e3187e6de5c52749bd6afa811006d8c
          path: baseharbor

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: baseharbor/go.mod
          cache: false

      - name: Build baha
        run: go build -o "$RUNNER_TEMP/baha" ./cmd/baha
        working-directory: baseharbor

      - name: Run targeted init gate
        env:
          DEMO_ROOT: ${{ github.workspace }}
          BAHA: ${{ runner.temp }}/baha
          ARTIFACT_DIR: ${{ runner.temp }}/init-artifacts
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          bash tests/init/run.sh
