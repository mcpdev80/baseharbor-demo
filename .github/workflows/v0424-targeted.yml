name: Targeted Demo compatibility
on:
  push:
    branches: [work/v0.4.24-ecosystem-release, work/v0.4.25-ecosystem-release, work/v0.4.26-ecosystem-release]
permissions:
  contents: read
concurrency:
  group: demo-v024-${{ github.ref }}
  cancel-in-progress: false
jobs:
  recovery:
    if: contains(github.event.head_commit.message, '[demo-runtime]') || contains(github.event.head_commit.message, '[demo-podman-runtime]') || contains(github.event.head_commit.message, '[demo-docker-runtime]')
    name: Demo install and backup recovery · ${{ matrix.runtime }}
    runs-on: ${{ matrix.runtime == 'podman' && 'ubuntu-26.04' || 'ubuntu-latest' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runtime: ${{ fromJSON(contains(github.event.head_commit.message, '[demo-podman-runtime]') && '["podman"]' || contains(github.event.head_commit.message, '[demo-docker-runtime]') && '["docker"]' || '["docker","podman"]') }}
    env:
      BASEHARBOR_TEST_RUNTIME: ${{ matrix.runtime }}
      BASEHARBOR_DEMO_RECOVERY_MODE: ${{ contains(github.event.head_commit.message, '[demo-fresh-recovery]') && 'fresh-owner' || 'retained' }}
      BASEHARBOR_RUNTIME_IMAGE: localhost/baseharbor-runtime:demo-v024
      DEMO_ATOMIC_GATE: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify fixture consent, syntax and selected topology code
        run: |
          python3 -m unittest discover -s tests -p test_fixture_consent.py
          python3 -m py_compile tests/fixture-consent.py tests/guided/drive.py tests/native-default-topology.py
          bash -n scripts/acceptance.sh tests/backup-restore/run.sh tests/lib.sh
      - name: Bind isolated fixture paths
        shell: bash
        run: |
          echo "BASEHARBOR_SOURCE_DIR=$RUNNER_TEMP/demo-core-source" >> "$GITHUB_ENV"
          echo "BASEHARBOR_INSTALL_DIR=$RUNNER_TEMP/demo-bin" >> "$GITHUB_ENV"
          echo "ARTIFACT_DIR=$RUNNER_TEMP/demo-evidence" >> "$GITHUB_ENV"
      - name: Resolve immutable Core
        id: core
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(cat baseharbor-core.ref)"
          [[ "$candidate" =~ ^[0-9a-f]{40}$ ]] || {
            echo "baseharbor-core.ref is not a 40-hex Core SHA: ${candidate:?}" >&2
            exit 1
          }
          # actions/checkout@v7.0.1 fetches a pinned Core SHA with a shallow
          # single-object fetch (`git fetch origin <40hex>`), which aborts with
          # an invalid `+refs/heads/<sha>*` refspec when the pinned develop-tip
          # object is momentarily unserveable (a force-push mid-run) before the
          # runner records a per-step failure. Verify the object id is serveable
          # up front via the GitHub commits API and fail fast, so the checkout
          # never drops into the branch-prefix fallback.
          code="$(curl -s -o /dev/null -w '%{http_code}' \
            "https://api.github.com/repos/mcpdev80/baseharbor/commits/$candidate")"
          if [ "$code" != "200" ]; then
            echo "Core SHA $candidate not serveable from baseharbor (API $code)" >&2
            exit 1
          fi
          echo "sha=$candidate" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7.0.1
        with:
          repository: mcpdev80/baseharbor
          ref: ${{ steps.core.outputs.sha }}
          path: .core-runtime-tools
          persist-credentials: false
      - name: Prepare isolated rootless runtime
        run: bash .core-runtime-tools/scripts/ci-core-rootless-runtime.sh
      - uses: actions/setup-go@v7
        with:
          go-version-file: .core-runtime-tools/go.mod
          cache: false
      - name: Install exact pinned Core binary and runtime image
        run: bash scripts/install-baseharbor.sh
      - name: Targeted native application backup and restore
        run: bash scripts/acceptance.sh backup-restore
      - name: Retain public result summary
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: demo-v024-${{ matrix.runtime }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/demo-evidence/results.tsv
            ${{ runner.temp }}/demo-evidence/report.md
            ${{ runner.temp }}/demo-evidence/native-topology-*.json
            ${{ runner.temp }}/demo-evidence/recovery-qualified.json
            ${{ runner.temp }}/demo-evidence/failure-runtime/cleanup-preparation/scope-result.json
          if-no-files-found: warn

# re-trigger verified Core serveability pre-check [demo-runtime]
