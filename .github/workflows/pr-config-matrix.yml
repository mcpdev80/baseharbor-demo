# DRAFT ONLY — owner-scope workflow addition; not committed or run.
name: Demo · PR config matrix

on:
  pull_request:
    branches: [develop]
    paths:
      - .github/workflows/pr-config-matrix.yml
      - baseharbor-core.ref
      - compose.yaml
      - scripts/acceptance.sh
      - scripts/failure-runtime-diagnostics.sh
      - scripts/install-baseharbor.sh
      - tests/config-matrix/**
      - tests/fixture-consent.py
      - tests/guided/**
      - tests/lib.sh

permissions:
  contents: read

jobs:
  config-matrix:
    name: Config Matrix · full config-matrix acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BASEHARBOR_TEST_RUNTIME: docker
      DEMO_ATOMIC_GATE: '1'
      GOFLAGS: -tags=baseharbor_ci_operator_testonly
      ARTIFACT_DIR: ${{ runner.temp }}/demo-config-matrix-artifacts
      BASEHARBOR_INSTALL_DIR: ${{ runner.temp }}/demo-config-matrix-bin
      BASEHARBOR_SOURCE_DIR: ${{ runner.temp }}/demo-config-matrix-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Validate pinned Core revision
        id: core
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(cat baseharbor-core.ref)"
          [[ "$candidate" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$candidate" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mcpdev80/baseharbor
          ref: ${{ steps.core.outputs.sha }}
          path: .core-runtime-tools
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: .core-runtime-tools/go.mod
          cache: false
      - name: Run full config-matrix acceptance at the exact Demo PR head
        shell: bash
        run: bash scripts/acceptance.sh config-matrix
