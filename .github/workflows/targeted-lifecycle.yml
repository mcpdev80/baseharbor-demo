name: targeted-lifecycle-acceptance

on:
  push:
    branches:
      - 'ci-target/**'

permissions:
  contents: read

jobs:
  lifecycle:
    runs-on: [self-hosted, Linux, X64, baseharbor, docker]
    timeout-minutes: 30
    env:
      ARTIFACT_DIR: /tmp/baseharbor-demo-targeted
      BASEHARBOR_SOURCE_REF: ${{ vars.BASEHARBOR_TARGET_REF || 'develop' }}
      BASEHARBOR_TEST_RUNTIME: docker

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Resolve candidate ref
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .github/baseharbor-target-ref ]; then
            ref="$(tr -d '[:space:]' < .github/baseharbor-target-ref)"
            test -n "$ref"
            echo "BASEHARBOR_SOURCE_REF=$ref" >> "$GITHUB_ENV"
          fi

      - name: Run lifecycle acceptance only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ARTIFACT_DIR"
          bash scripts/acceptance.sh lifecycle

      - name: Upload lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: targeted-lifecycle-acceptance
          path: /tmp/baseharbor-demo-targeted/
          if-no-files-found: warn
