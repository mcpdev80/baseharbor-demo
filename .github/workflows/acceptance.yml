name: baseharbor-release-acceptance

on:
  workflow_dispatch:
    inputs:
      version:
        description: BaseHarbor release tag, for example v0.4.14
        required: true
        type: string
  repository_dispatch:
    types:
      - baseharbor_release

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BASEHARBOR_VERSION: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.version || inputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Verify release version
        run: |
          test -n "$BASEHARBOR_VERSION"
          case "$BASEHARBOR_VERSION" in
            v*) ;;
            *) echo "version must be a release tag such as v0.4.14" >&2; exit 1 ;;
          esac

      - name: Run external BaseHarbor acceptance
        run: bash scripts/acceptance.sh

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: baseharbor-${{ env.BASEHARBOR_VERSION }}-acceptance
          path: artifacts/
          if-no-files-found: warn
