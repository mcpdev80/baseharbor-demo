name: baseharbor-acceptance

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Acceptance mode
        required: true
        default: candidate
        type: choice
        options:
          - candidate
          - release
      source_ref:
        description: BaseHarbor source ref/SHA for candidate mode
        required: false
        default: develop
        type: string
      version:
        description: BaseHarbor release tag for release mode, for example v0.4.14
        required: false
        type: string
      groups:
        description: Comma-separated demo groups, empty means full acceptance
        required: false
        default: ""
        type: string
  repository_dispatch:
    types:
      - baseharbor_release

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ACCEPTANCE_MODE: ${{ github.event_name == 'repository_dispatch' && 'release' || inputs.mode }}
      BASEHARBOR_SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'candidate' && inputs.source_ref || '' }}
      BASEHARBOR_VERSION: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.version || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release' && inputs.version || '') }}
      DEMO_GROUPS: ${{ github.event_name == 'workflow_dispatch' && inputs.groups || '' }}

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Validate acceptance target
        shell: bash
        run: |
          set -euo pipefail
          case "$ACCEPTANCE_MODE" in
            candidate)
              test -n "$BASEHARBOR_SOURCE_REF"
              ;;
            release)
              case "$BASEHARBOR_VERSION" in
                v*) ;;
                *) echo "release mode requires a tag such as v0.4.14" >&2; exit 1 ;;
              esac
              ;;
            *)
              echo "unsupported acceptance mode: $ACCEPTANCE_MODE" >&2
              exit 1
              ;;
          esac

      - name: Run external BaseHarbor acceptance
        run: bash scripts/acceptance.sh

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: baseharbor-${{ env.ACCEPTANCE_MODE }}-acceptance
          path: artifacts/
          if-no-files-found: warn
