services:
  demo-app:
    build:
      context: ./demo-app
    ports:
      - "${DEMO_HTTP_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: ${DATABASE_URL:-postgres://demo:demo@postgres:5432/demo?sslmode=disable}
      REDIS_URL: ${REDIS_URL:-redis://valkey:6379/0}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://object-storage:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-demo}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-demo-demo-demo}
      S3_BUCKET: ${S3_BUCKET:-uploads}
      APP_SECRET: ${APP_SECRET:-standalone-demo-secret}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      COMPANION_URL: ${COMPANION_URL:-}
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    profiles: ["standalone"]
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: demo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d demo"]
      interval: 2s
      timeout: 2s
      retries: 20

  valkey:
    image: valkey/valkey:8-alpine
    profiles: ["standalone"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20

  object-storage:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    profiles: ["standalone"]
    command: server /data
    environment:
      MINIO_ROOT_USER: demo
      MINIO_ROOT_PASSWORD: demo-demo-demo
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 20
